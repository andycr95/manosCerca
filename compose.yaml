services:
  postgres:
    image: postgres:16-alpine
    container_name: turahelp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: turahelp
      POSTGRES_USER: turahelp
      POSTGRES_PASSWORD: turahelp_local_only
    ports:
      - "5434:5432"
    volumes:
      - turahelp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U turahelp -d turahelp"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  turahelp_postgres_data:
